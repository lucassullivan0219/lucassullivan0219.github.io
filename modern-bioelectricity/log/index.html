<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作紀錄 · Modern Bioelectricity</title>
<meta name="description" content="Modern Bioelectricity 的每個指令、每次更動、每個測試結果，一筆一行，點開看細節。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../style.css">
<style>
body{font-family:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif}
main{max-width:960px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.bar input{flex:1 1 220px;font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.chip{font:inherit;font-size:.85rem;padding:4px 11px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.count{color:var(--muted);font-size:.85rem}
details.e{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
details.e > summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 12px;align-items:baseline}
details.e > summary::-webkit-details-marker{display:none}
.id{font-family:"IBM Plex Mono",monospace;font-weight:500}
.d{color:var(--muted);font-size:.85rem;white-space:nowrap}
.ty{font-size:.78rem;font-weight:600;padding:0 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.t-指令{color:#2f6fed}.t-變更{color:#2f8a4a}.t-測試{color:#a86b00}.t-分析{color:#7a3e8f}.t-決定{color:#0f7c86}.t-更正{color:#b5432f}.t-撤回{color:#8a8a84}.t-索引{color:#8a8a84}
@media(prefers-color-scheme:dark){.t-指令{color:#7aa2ff}.t-變更{color:#7fc08a}.t-測試{color:#e0b64f}.t-分析{color:#c99bdb}.t-決定{color:#5fc4cc}.t-更正{color:#e8826f}}
.one{grid-column:3}
.st{color:var(--muted);font-size:.8rem;white-space:nowrap}
.body{padding:0 16px 12px;border-top:1px solid var(--line);font-size:.93rem}
.body ul{padding-left:1.2em;margin:8px 0}
.body li{margin:3px 0}
.body blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--accent);color:var(--fg);background:rgba(127,127,127,.07);white-space:pre-wrap}
.body code{font-family:"IBM Plex Mono",monospace;font-size:.88em}
.tags{color:var(--muted);font-size:.8rem}
.err{color:#b5432f}
@media(max-width:640px){details.e > summary{grid-template-columns:auto 1fr auto}.d{grid-column:1/-1;order:-1}.one{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Modern Bioelectricity</a>
  <h1>工作紀錄</h1>
  <p class="lead">每個指令、每次更動、每個測試結果，一筆一行，點開看細節。只往下加不改舊的；寫錯的用新的一筆更正。規則：<a href="README.md">README</a>。原始檔：<a href="INDEX.md">INDEX.md</a>。</p>
  <div class="bar">
    <input type="search" id="q" placeholder="搜尋：編號、關鍵字、數字、commit…" aria-label="搜尋紀錄">
    <span id="types"></span>
    <span class="count" id="count"></span>
  </div>
  <div id="list"><p class="count">載入中…</p></div>
  <footer>© 2026 Lucas Sullivan</footer>
</main>
<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(s){
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\b([0-9a-f]{7})\b/g, '<a href="https://github.com/lucassullivan0219/lucassullivan0219.github.io/commit/$1">$1</a>')
      .replace(/\b(MB-\d{3,})\b/g, '<a href="#$1">$1</a>');
  }
  /* the small markdown subset the log uses: "- " lists (nested by indent) and "> " quotes */
  function md(text){
    var out = [], depth = 0, quote = [];
    function flushQuote(){ if(quote.length){ out.push('<blockquote>' + quote.map(inline).join('\n') + '</blockquote>'); quote = []; } }
    text.split('\n').forEach(function(line){
      var q = /^\s*>\s?(.*)$/.exec(line);
      if(q){ quote.push(q[1]); return; }
      flushQuote();
      var m = /^(\s*)- (.*)$/.exec(line);
      if(m){
        var d = Math.floor(m[1].length / 2) + 1;
        while(depth < d){ out.push('<ul>'); depth++; }
        while(depth > d){ out.push('</ul>'); depth--; }
        out.push('<li>' + inline(m[2]));
        return;
      }
      if(line.trim()){ while(depth){ out.push('</ul>'); depth--; } out.push('<p>' + inline(line) + '</p>'); }
    });
    flushQuote();
    while(depth){ out.push('</ul>'); depth--; }
    return out.join('');
  }
  function cells(line){ return line.split('|').slice(1, -1).map(function(c){ return c.trim(); }); }

  fetch('INDEX.md', {cache:'no-cache'}).then(function(r){ return r.text(); }).then(function(idx){
    var rows = idx.split('\n').filter(function(l){ return /^\|\s*MB-\d+/.test(l); }).map(cells);
    var months = {};
    rows.forEach(function(c){ months[c[1].slice(0, 7)] = 1; });
    return Promise.all(Object.keys(months).map(function(m){
      return fetch(m + '.md', {cache:'no-cache'}).then(function(r){ return r.ok ? r.text() : ''; });
    })).then(function(texts){
      var full = {};
      texts.join('\n').split(/^## /m).forEach(function(chunk){
        var h = /^(MB-\d+)[^\n]*\n([\s\S]*)$/.exec(chunk);
        if(h) full[h[1]] = h[2];
      });
      render(rows.map(function(c){ return {id:c[0], date:c[1], type:c[2], one:c[3], tags:c[4], status:c[5], body:full[c[0]] || ''}; }).reverse());
    });
  }).catch(function(e){ $('#list').innerHTML = '<p class="err">讀不到紀錄：' + esc(e) + '</p>'; });

  function render(entries){
    var types = [];
    entries.forEach(function(e){ if(types.indexOf(e.type) < 0) types.push(e.type); });
    var on = {};
    $('#types').innerHTML = types.map(function(t){ return '<button class="chip" type="button" aria-pressed="false" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join(' ');
    $('#list').innerHTML = entries.map(function(e){
      return '<details class="e" id="' + e.id + '" data-t="' + esc(e.type) + '"><summary><span class="id">' + e.id + '</span><span class="ty t-' + esc(e.type) + '">' + esc(e.type) + '</span>' +
        '<span class="one">' + inline(e.one) + '</span><span class="st">' + esc(e.status) + '</span><span class="d">' + esc(e.date) + '</span></summary>' +
        '<div class="body">' + md(e.body) + '<p class="tags">標籤：' + esc(e.tags) + '</p></div></details>';
    }).join('');
    var els = Array.prototype.slice.call(document.querySelectorAll('details.e'));
    function filter(){
      var q = $('#q').value.trim().toLowerCase(), any = Object.keys(on).some(function(k){ return on[k]; }), n = 0;
      els.forEach(function(el, i){
        var e = entries[i], hit = (!any || on[e.type]) && (!q || (e.id + ' ' + e.one + ' ' + e.tags + ' ' + e.body).toLowerCase().indexOf(q) >= 0);
        el.hidden = !hit; if(hit) n++;
      });
      $('#count').textContent = n + ' / ' + entries.length + ' 筆';
    }
    $('#q').addEventListener('input', filter);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
      b.addEventListener('click', function(){ on[b.dataset.t] = !on[b.dataset.t]; b.setAttribute('aria-pressed', on[b.dataset.t] ? 'true' : 'false'); filter(); });
    });
    filter();
    if(location.hash){ var t = document.getElementById(location.hash.slice(1)); if(t){ t.open = true; t.scrollIntoView(); } }
    window.addEventListener('hashchange', function(){ var t = document.getElementById(location.hash.slice(1)); if(t){ t.open = true; } });
  }
})();
</script>
</body>
</html>
