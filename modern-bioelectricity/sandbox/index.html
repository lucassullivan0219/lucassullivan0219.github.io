<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox! · Modern Bioelectricity</title>
<meta name="description" content="Build neuron-membrane circuits from kit boards, in 3D or as a schematic, and probe them with a virtual oscilloscope.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="sandbox.css?v=20261022f">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">

  <!-- ===== top HUD ===== -->
  <header class="hud">
    <a class="chip back" href="../" title="Back to Modern Bioelectricity">◀ BACK</a>
    <h1 class="logo">SANDBOX<span>!</span><small>prototype</small></h1>
    <div class="seg" role="tablist" aria-label="View">
      <button type="button" class="on" data-view="3d" role="tab">3D VIEW</button>
      <button type="button" data-view="schema" role="tab">CIRCUIT SCHEMA</button>
    </div>
    <div class="grow"></div>
    <label class="chip bp">BLUEPRINT
      <select id="blueprint" aria-label="Load a blueprint"></select>
    </label>
    <button type="button" class="chip warn" id="btn-clear">CLEAR</button>
    <button type="button" class="chip power on" id="btn-power" aria-pressed="true">⏻ POWER</button>
  </header>

  <!-- ===== left: parts drawer ===== -->
  <aside class="drawer" id="drawer" aria-label="Parts">
    <div class="panel-head">PARTS<small>drag onto a slot · or tap ＋</small></div>
    <div class="parts" id="parts"></div>
    <button type="button" class="tab tab-l" id="tab-drawer" aria-label="Hide parts">◀</button>
  </aside>

  <!-- ===== center: build stage ===== -->
  <main class="stage" id="stage">
    <div class="view on" id="view-3d">
      <canvas id="c3d" aria-label="3D build area"></canvas>
      <div class="hint3d">drag = orbit · wheel = zoom · click a board to edit · click the red SW to press</div>
    </div>
    <div class="view" id="view-schema">
      <div class="strip" id="strip" aria-label="Assembly"></div>
      <div class="schwrap" id="schwrap"><svg id="sch" role="img" aria-label="Circuit schematic"></svg><div class="empty" id="schempty">Add a <b>Stimulator</b> to see the circuit.</div></div>
    </div>

    <div class="status" id="status"></div>

    <div class="selpanel" id="selpanel" hidden>
      <div class="sp-h"><b id="sp-name"></b><button type="button" class="x" id="sp-x" aria-label="Close">✕</button></div>
      <div class="sp-d" id="sp-desc"></div>
      <div class="sp-v" id="sp-vers"></div>
      <div class="sp-a">
        <button type="button" class="chip" id="sp-left">◀ MOVE</button>
        <button type="button" class="chip" id="sp-right">MOVE ▶</button>
        <button type="button" class="chip warn" id="sp-del">REMOVE</button>
      </div>
    </div>

    <div class="pad" id="pad">
      <div class="pot">
        <div class="pot-l">STIM POT <b id="pot-v">0.7 kΩ</b><small id="pot-i">≈ 84 µA</small></div>
        <input type="range" id="pot" min="0" max="10" step="0.1" value="0.7" aria-label="Stimulator pot (kΩ)">
      </div>
      <div class="pulses" id="pulses"></div>
      <button type="button" class="swbig" id="swbig" aria-label="Hold to press SW">SW<small>HOLD</small></button>
    </div>
  </main>

  <!-- ===== right: oscilloscope bay ===== -->
  <aside class="bay" id="bay" aria-label="Oscilloscope">
    <button type="button" class="tab tab-r" id="tab-bay" aria-label="Hide oscilloscope">▶</button>
    <div class="bay-in">
      <div class="scopefit" id="scopefit"><div class="scope" id="scope"></div></div>
      <div class="rack">
        <div class="panel-head">PROBES<small>where each scope lead is clipped</small></div>
        <div class="probe" data-ch="1"><span class="pl c1">CH1</span><div class="nodes" id="nodes1"></div></div>
        <div class="probe" data-ch="2"><span class="pl c2">CH2</span><div class="nodes" id="nodes2"></div></div>
        <div class="meas" id="meas"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../active-membrane-sim/engine.js"></script>
<script src="../active-membrane-sim/schematic.js?v=20261021"></script>
<script src="scope.js?v=20261022f"></script>
<script type="module" src="sandbox.js?v=20261022f"></script>
</body>
</html>
